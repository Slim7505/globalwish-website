{% macro icon(name, cls="ico") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "speech" -%}
<path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v2.5L16 18h-3"/><path d="M6 9h7M6 12h4"/>
{%- elif name == "stage" -%}
<path d="M3 4h18M5 4v4c0 2 1.5 3 3 3M19 4v4c0 2-1.5 3-3 3"/><path d="M8 11c0 4 1.8 6 4 6s4-2 4-6"/><path d="M3 20h18M12 17v3"/>
{%- elif name == "crate" -%}
<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/><path d="M7.5 5.5l9 5"/>
{%- elif name == "brush" -%}
<path d="M14.5 3.5l6 6L12 18l-6-6z"/><path d="M6 12c-2.5 0-3.5 1.6-3.5 4.5 0 1.4-.5 2.5-1 3 3.5.5 7.5-.5 7.5-4.5"/>
{%- elif name == "arrow" -%}
<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "mail" -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- elif name == "phone" -%}
<path d="M5 3h3l2 5-2.5 1.5a11 11 0 0 0 7 7L16 14l5 2v3a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>
{%- elif name == "fax" -%}
<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M7 15h10v6H7z"/>
{%- elif name == "pin" -%}
<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "instagram" -%}
<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/>
{%- elif name == "cart" -%}
<path d="M3 4h2l2.4 11h11L21 7H6"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>
{%- elif name == "globe" -%}
<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
{%- elif name == "menu" -%}
<path d="M4 7h16M4 12h16M4 17h10"/>
{%- elif name == "close" -%}
<path d="M6 6l12 12M18 6L6 18"/>
{%- endif -%}
</svg>
{%- endmacro %}

{# Folk-art divider: a stylised flower and leaves, drawn in honey gold. #}
{% macro ornament(cls="ornament") -%}
<svg class="{{ cls }}" viewBox="0 0 220 28" aria-hidden="true" focusable="false">
  <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <path d="M2 14h70M148 14h70"/>
    <path d="M78 14c8-9 16-9 22 0-6 9-14 9-22 0zM142 14c-8-9-16-9-22 0 6 9 14 9 22 0z"/>
  </g>
  <g fill="currentColor">
    <circle cx="110" cy="14" r="4.2"/>
    <path d="M110 2.5c2.6 3 2.6 5.6 0 7.4-2.6-1.8-2.6-4.4 0-7.4zM110 25.5c2.6-3 2.6-5.6 0-7.4-2.6 1.8-2.6 4.4 0 7.4zM98.5 14c3-2.6 5.6-2.6 7.4 0-1.8 2.6-4.4 2.6-7.4 0zM121.5 14c-3-2.6-5.6-2.6-7.4 0 1.8 2.6 4.4 2.6 7.4 0z"/>
    <circle cx="72" cy="14" r="1.8"/><circle cx="148" cy="14" r="1.8"/>
  </g>
</svg>
{%- endmacro %}

{% macro img(name, alt, cls="", loading="lazy") -%}
{%- set d = site.images[name] -%}
<img class="{{ cls }}" src="{{ root }}assets/img/{{ name }}.webp" width="{{ d[0] }}" height="{{ d[1] }}" alt="{{ alt }}" loading="{{ loading }}" decoding="async"{% if loading == "eager" %} fetchpriority="high"{% endif %}>
{%- endmacro %}
